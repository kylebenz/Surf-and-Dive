# Performance regression protection. Runs on every pull request and on pushes to the
# production branch. Fails when a change breaks the performance budget, Lighthouse
# thresholds (mobile and desktop) or the cross-browser media/loading tests.
name: Performance

on:
  pull_request:
  push:
    branches: [claude/friendly-turing-64bgzr]
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test media (synthetic photos and video; real photos are never overwritten)
        run: npm run test:fixtures && npm run media:video
      - name: Build with the media test page and a strict performance budget
        run: npm run build
        env:
          MEDIA_TEST_PAGE: '1'
          PERF_BUDGET_STRICT: '1'
      - run: npm run qa
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Lighthouse (desktop)
        if: always()
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm run test:fixtures && npm run media:video
      - run: npm run build
        env:
          MEDIA_TEST_PAGE: '1'
      - name: Install browsers (Chromium, WebKit/Safari, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox
      - name: iPhone, iPad, Android, desktop Safari, Chrome and Firefox
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
