# IndexNow: after every production deploy, tell Bing (and the other IndexNow search engines)
# exactly which pages were added, changed or removed. See scripts/indexnow.mjs.
#
# Runs on every push to the production branch, waits until the live site serves that commit (up
# to 20 minutes), then submits. This works with any host, whether or not it reports deployments
# to GitHub. To submit every page by hand: Actions → IndexNow → Run workflow (tick "all").
# If the live address is not https://surfanddive.com or https://www.surfanddive.com, set the
# repository variable SITE_ORIGIN (Settings → Secrets and variables → Actions → Variables).
name: IndexNow

on:
  push:
    branches: [claude/friendly-turing-64bgzr]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page, not only changed ones
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The fingerprints from the last submission, so only changed pages are sent next time.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Submit changed pages
        run: >-
          node scripts/indexnow.mjs submit
          --previous .indexnow/previous.json --out .indexnow/previous.json
          ${{ github.event_name == 'push' && format('--wait-for {0}', github.sha) || '' }}
          ${{ inputs.all && '--all' || '' }}
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .indexnow/previous.json
          key: indexnow-${{ github.run_id }}
