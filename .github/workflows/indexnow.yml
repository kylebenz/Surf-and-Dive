# IndexNow: after every successful Vercel production deploy, tell Bing (and the other IndexNow
# search engines) exactly which pages were added, changed or removed. See scripts/indexnow.mjs.
#
# Runs automatically from the deployment statuses Vercel reports to GitHub. To submit every page
# by hand: Actions → IndexNow → Run workflow (tick "all").
# If the live address is not https://surfanddive.com or https://www.surfanddive.com, set the
# repository variable SITE_ORIGIN (Settings → Secrets and variables → Actions → Variables).
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page, not only changed ones
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The fingerprints from the last submission, so only changed pages are sent next time.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Submit changed pages
        run: node scripts/indexnow.mjs submit --previous .indexnow/previous.json --out .indexnow/previous.json ${{ inputs.all && '--all' || '' }}
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .indexnow/previous.json
          key: indexnow-${{ github.run_id }}
